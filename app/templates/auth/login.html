{% extends "base.html" %}
{% block title %}로그인 · Habit Tracker{% endblock %}
{% block content %}
  <section class="card" aria-labelledby="login-title">
    <h1 id="login-title">다시 만나서 반가워요</h1>
    <p class="muted">오늘의 작은 실천을 이어가세요.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">아이디 또는 이메일</label>
      <input id="username" name="username" required maxlength="254" autocomplete="username">
      <label for="password">비밀번호</label>
      <div class="password-field">
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <button
          class="secondary compact"
          type="button"
          data-password-toggle
          aria-controls="password"
          aria-pressed="false"
        >표시</button>
      </div>
      <button type="submit">로그인</button>
    </form>
  </section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='/js/password-visibility.js') }}" defer></script>{% endblock %}
