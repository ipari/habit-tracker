{% extends "base.html" %}
{% block title %}{{ habit.name }} 공유 · Habit Tracker{% endblock %}
{% block content %}
  <header class="form-header share-header">
    <a class="back-link" href="/habits/{{ habit.id }}?from={{ return_to }}">‹ {{ habit.name }}</a>
  </header>

  <section
    id="share-composer"
    class="share-composer"
    data-habit-name="{{ habit.name }}"
    data-habit-emoji="{{ share_emoji }}"
    data-streak="{{ streak }}"
    data-start-label="{{ start_label }}"
    data-preset="{{ habit.background_preset }}"
  >
    <div class="share-preview-frame" aria-busy="true">
      <canvas
        id="share-canvas"
        width="1080"
        height="1920"
        role="img"
        aria-label="{{ habit.name }}, 연속 {{ streak }}회 달성 공유 이미지 미리보기"
      ></canvas>
    </div>
    <p id="share-status" class="sr-only" role="status" aria-live="polite">이미지를 준비하고 있습니다.</p>
    <div class="share-actions">
      <button id="share-image" type="button" aria-label="공유" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      </button>
      <button id="download-image" type="button" aria-label="다운로드" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13m0 0 4.5-4.5M12 16l-4.5-4.5M5 20h14"/></svg>
      </button>
    </div>
  </section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='/js/share.js') }}?v=2"></script>{% endblock %}
{% block tabbar %}{% include "_tab_bar.html" %}{% endblock %}
