<div id="today-habits">
  {% if habits %}
    <section class="habit-list" aria-label="오늘 수행할 습관">
      {% for item in habits %}
        {% include "habits/_today_card.html" %}
      {% endfor %}
    </section>
  {% else %}
    <section class="card empty" aria-labelledby="empty-title">
      <div class="empty-icon" aria-hidden="true">🌿</div>
      <h2 id="empty-title">오늘 예정된 습관이 없어요</h2>
      <p class="muted">새 습관을 만들거나 오늘은 여유롭게 쉬어가세요.</p>
    </section>
  {% endif %}
</div>
