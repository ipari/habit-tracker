{% extends "base.html" %}
{% block title %}오늘 · Habit Tracker{% endblock %}
{% block content %}
  <header class="app-header">
    <h1>오늘</h1>
    <p class="muted date-label"><time datetime="{{ local_date.isoformat() }}">{{ date_label }}</time></p>
  </header>
  <div id="sync-error" class="error-slot" role="alert" aria-live="assertive">{% if save_error %}저장하지 못했습니다. 다시 시도해 주세요.{% endif %}</div>

  {% include "habits/_today_list.html" %}
  <a class="add-habit-row" href="/habits/new">
    <span class="add-habit-icon" aria-hidden="true">+</span>
    <span>새 습관 추가</span>
  </a>
{% endblock %}
{% block tabbar %}{% include "_tab_bar.html" %}{% endblock %}
