services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/habit_tracker.db
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
      --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      - habit_data:/data
    ports:
      - "${HABIT_TRACKER_BIND_ADDRESS:-127.0.0.1}:${HABIT_TRACKER_PORT:-8000}:8000"
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/habit_tracker.db
    command: python -m app.reminders.scheduler
    volumes:
      - habit_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert b'app.reminders.scheduler' in Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  habit_data:
